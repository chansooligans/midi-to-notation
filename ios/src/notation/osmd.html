<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; }
    #container { background: #fff; border-radius: 8px; padding: 12px; min-height: 200px; }
    #status { color: #888; text-align: center; padding: 40px; font-family: sans-serif; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.6/build/opensheetmusicdisplay.min.js"></script>
</head>
<body>
  <div id="container">
    <div id="status">Waiting for notation...</div>
  </div>
  <script>
    let osmd = null;

    function initOSMD() {
      if (osmd) return;
      const el = document.getElementById("container");
      document.getElementById("status")?.remove();
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(el, {
        autoResize: true,
        backend: "svg",
        drawTitle: true,
      });
    }

    window.addEventListener("message", async (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === "render" && data.musicxml) {
          initOSMD();
          await osmd.load(data.musicxml);
          osmd.render();
          window.ReactNativeWebView?.postMessage(JSON.stringify({ type: "rendered", ok: true }));
        }
      } catch (err) {
        window.ReactNativeWebView?.postMessage(JSON.stringify({ type: "error", message: String(err) }));
      }
    });
  </script>
</body>
</html>
